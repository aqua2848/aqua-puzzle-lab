<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>AQUA Puzzle Lab</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#26345f 0,#111827 52%,#090e1a 100%);color:#fff}.wrap{max-width:960px;margin:auto;padding:48px 20px 64px}.eyebrow{letter-spacing:.2em;font-weight:800;color:#67e8f9;margin:0 0 8px}.hero h1{font-size:clamp(2.2rem,7vw,4.4rem);margin:0}.hero p{color:#cbd5e1;font-size:1.05rem}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px;margin-top:36px}.card{display:block;text-decoration:none;color:inherit;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:26px;transition:.2s;box-shadow:0 18px 50px rgba(0,0,0,.22)}.card:hover{transform:translateY(-5px);background:rgba(255,255,255,.12)}.icon{font-size:4rem}.card h2{font-size:1.6rem;margin:12px 0 8px}.card p{color:#cbd5e1;line-height:1.7}.play{display:inline-block;margin-top:12px;font-weight:800;color:#67e8f9}.tag{display:inline-block;font-size:.75rem;background:#334155;border-radius:999px;padding:5px 9px;margin-right:6px;color:#e2e8f0}.footer{margin-top:34px;color:#64748b;text-align:center}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <p class="eyebrow">AQUA PUZZLE LAB</p>
      <h1>今日はどれで遊ぶ？</h1>
      <p>ブラウザだけでサクッと遊べる、小さなパズル置き場。</p>
    </section>
    <section class="games">
      <a class="card" href="water-sort.html">
        <div class="icon">🧪</div><span class="tag">SORT</span><span class="tag">COLOR</span>
        <h2>Water Sort Puzzle</h2>
        <p>試験管の色水を移し替えて、1本1色にそろえよう。Undo・Restart対応。</p>
        <span class="play">PLAY →</span>
      </a>
      <a class="card" href="cat-doku.html">
        <div class="icon">🐱</div><span class="tag">LOGIC</span><span class="tag">CAT</span>
        <h2>Cat Doku</h2>
        <p>行・列・色エリアに猫は1匹ずつ。さらに猫同士は隣り合わない。猫版ロジックパズル！</p>
        <span class="play">PLAY →</span>
      </a>
    </section>
    <div class="footer">AQUA Puzzle Lab</div>
  </main>
</body>
</html>
