<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f7f4" />
  <title>Arrow Escape | AQUA Puzzle Lab</title>
  <link rel="stylesheet" href="arrow-escape.css" />
</head>
<body>
  <main class="app">
    <a class="back" href="index.html">← Puzzle Lab</a>

    <header>
      <div>
        <p class="eyebrow">AQUA PUZZLE LAB</p>
        <h1>Arrow Escape</h1>
        <p class="sub">道をふさぐ矢印をほどいて、全部すべらせて逃がそう。</p>
      </div>
      <div class="stats">
        <div><span>LEVEL</span><strong id="levelNumber">1</strong></div>
        <div><span>LEFT</span><strong id="leftCount">0</strong></div>
      </div>
    </header>

    <section class="game-card">
      <div id="message" class="message" role="status" aria-live="polite">先が空いている矢印をタップ！</div>
      <div class="board-wrap">
        <div id="board" class="board" aria-label="矢印脱出パズル"></div>
      </div>
      <div class="controls">
        <button id="restartButton" type="button">↻ Restart</button>
        <button id="newButton" type="button">✦ New Puzzle</button>
        <button id="nextButton" class="primary" type="button" disabled>Next Level →</button>
      </div>
    </section>

    <section class="help">
      <h2>How to play</h2>
      <p>矢印をタップすると、その向きへ一直線に進みます。進行方向にほかの矢印がなければ、そのまま盤外へスルッと脱出。全部の矢印を逃がせたらクリア！</p>
    </section>
  </main>

  <div id="celebration" class="celebration" aria-hidden="true"></div>
  <script src="arrow-escape.js"></script>
</body>
</html>
